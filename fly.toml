app = "accessrank"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    # Baked into canonical URLs and the sitemap at build time.
    SITE_URL = "https://accessrank.ai"
    # Public key, safe to commit. Must ALSO be present under [env] — build args
    # exist only while the image is built, and the server checks for this key at
    # runtime to decide whether the captcha is active.
    TURNSTILE_SITE_KEY = "0x4AAAAAAENYC8Br8Jb-rluz"
    PLAUSIBLE_DOMAIN = ""

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SITE_URL = "https://accessrank.ai"
  # Fly puts exactly one proxy hop in front of the app.
  TRUST_PROXY = "1"
  # Public, and required at RUNTIME too: config.turnstile.enabled needs both keys
  # present or the app refuses to boot in production. The build arg above does
  # not survive into the running container.
  TURNSTILE_SITE_KEY = "0x4AAAAAAENYC8Br8Jb-rluz"
  # Not secrets — plain addresses, so they belong here rather than in fly secrets.
  # Temporary: point at the Crier mailbox until info@accessrank.ai actually exists.
  EMAIL_REPLY_TO = "aws@crierpr.com"
  SALES_INBOX = "aws@crierpr.com"
  SCAN_CONCURRENCY = "2"
  SCAN_MAX_PAGES = "3"
  LIMIT_REPORTS_PER_EMAIL = "1"
  LIMIT_REPORTS_PER_IP_PER_DAY = "3"
  LIMIT_SCANS_PER_IP_PER_DAY = "8"

# Secrets are NOT set here. Use:
#   fly secrets set DATABASE_URL=... RESEND_API_KEY=... IP_HASH_SALT=... \
#                   TURNSTILE_SECRET_KEY=... ADMIN_TOKEN=...

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Chromium takes a few seconds to warm; keeping one machine resident avoids
  # a cold-start on the first visitor's scan.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "25s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  # Chromium is memory-hungry: 512MB will OOM-kill mid-scan under any real load.
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
