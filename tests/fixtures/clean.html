<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northwind Supply — organic cotton basics made in Portugal</title>
  <meta name="description" content="Northwind Supply makes organic cotton basics in Portugal. Free shipping over $50, free returns for 60 days, and every garment traceable to its mill.">
  <link rel="canonical" href="https://northwind.example/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>">
  <meta property="og:title" content="Northwind Supply">
  <meta property="og:description" content="Organic cotton basics made in Portugal.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://northwind.example/">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Organization","name":"Northwind Supply","url":"https://northwind.example/"}
  </script>
  <style>
    body { background: #ffffff; color: #1a1a1a; font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
    a { color: #0b4f9e; }
    .btn { background: #0b4f9e; color: #ffffff; border: 0; padding: 10px 18px; font-size: 16px; }
    :focus-visible { outline: 3px solid #0b4f9e; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <a href="#main">Skip to main content</a>
    <nav aria-label="Primary">
      <ul>
        <li><a href="/products">Shop all products</a></li>
        <li><a href="/collections">Browse collections</a></li>
        <li><a href="/cart">View your cart</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1>Organic cotton basics, made in Portugal</h1>

    <h2>Summer collection</h2>
    <p>Free shipping on orders over $50.</p>

    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
         alt="Ribbed cotton t-shirt in ecru, shown flat" width="200" height="200">
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
         alt="Heavyweight crew sweatshirt in navy" width="200" height="200">

    <h2>Stay in touch</h2>
    <form action="/subscribe" method="post">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email">

      <label for="zip">ZIP code</label>
      <input type="text" id="zip" name="zip" autocomplete="postal-code">

      <label for="size">Preferred size</label>
      <select id="size" name="size">
        <option value="s">Small</option>
        <option value="l">Large</option>
      </select>

      <button class="btn" type="submit">Subscribe to the newsletter</button>
    </form>

    <h2>Size guide</h2>
    <table>
      <caption>Measurements in centimetres</caption>
      <thead>
        <tr><th scope="col">Size</th><th scope="col">Chest</th></tr>
      </thead>
      <tbody>
        <tr><th scope="row">Small</th><td>96</td></tr>
        <tr><th scope="row">Large</th><td>112</td></tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>&copy; 2026 Northwind Supply</p>
  </footer>
</body>
</html>
