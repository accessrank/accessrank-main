<!doctype html>
<!--
  Deliberately broken storefront fixture.

  Every defect below is one axe-core is expected to catch, chosen to match the
  failures the marketing copy names: 1.1.1 alt text, 1.4.3 contrast, 3.3.2 form
  labels, 4.1.2 name/role/value, 2.4.4 link purpose, 1.3.1 heading order.

  NOTE: no <html lang>, no <title>, no meta description, no viewport, no
  canonical — so the SEO checklist should score badly too.
-->
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { background: #ffffff; font-family: sans-serif; }
    /* 1.4.3 — 1.6:1 contrast, far below the 4.5:1 minimum */
    .faint { color: #cccccc; background: #ffffff; }
    .btn { background: #f0f0f0; color: #e8e8e8; border: 0; padding: 8px 16px; }
  </style>
</head>
<body>
  <div id="header">
    <!-- 1.1.1 — logo image with no alt -->
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="120" height="40">
    <!-- 2.4.4 — link purpose unclear out of context -->
    <a href="/products">click here</a>
    <a href="/collections">read more</a>
    <a href="/cart"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></a>
  </div>

  <!-- 1.3.1 — starts at h3, then jumps to h6 -->
  <h3>Summer collection</h3>
  <h6>Bestsellers</h6>

  <p class="faint">Free shipping on orders over $50.</p>

  <!-- 1.1.1 — product images with no alt -->
  <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="200" height="200">
  <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="200" height="200">
  <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="200" height="200">

  <!-- 3.3.2 / 4.1.2 — inputs with no associated label -->
  <form action="/subscribe" method="post">
    <input type="email" name="email" placeholder="Email address">
    <input type="text" name="zip" placeholder="ZIP">
    <select name="size">
      <option>Small</option>
      <option>Large</option>
    </select>
    <button class="btn" type="submit">Go</button>
  </form>

  <!-- 4.1.2 — a div acting as a button, with no name or role -->
  <div onclick="void 0" class="btn">Add to cart</div>

  <!-- 4.1.2 — ARIA referencing an element that does not exist -->
  <div role="button" aria-labelledby="missing-label" tabindex="0">Checkout</div>

  <!-- duplicate ids -->
  <div id="dup">a</div>
  <div id="dup">b</div>

  <table>
    <tr><td>Size</td><td>Price</td></tr>
    <tr><td>S</td><td>$20</td></tr>
  </table>
</body>
</html>
